[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptshield-eval"
version = "1.0.0"
description = "Frontier AI Adversarial & Red-Teaming Ground-Truth Benchmark for LLMs"
readme = "README.md"
authors = [{ name = "Milind Chatrabhuji" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
